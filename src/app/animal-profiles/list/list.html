<ng-template #menuTemplate let-row="row">
  <sky-dropdown
    data-sky-id="context-menu"
    buttonType="context-menu"
    [label]="row.name + ' context menu'"
  >
    <sky-dropdown-menu>
      <sky-dropdown-item>
        <button
          type="button"
          (click)="toggleNeedsAttention(row)"
          [attr.aria-label]="'Toggle needs-attention for ' + row.name"
        >
          <sky-icon iconName="star" />
          Toggle needs-attention
        </button>
      </sky-dropdown-item>
      <sky-dropdown-item>
        <button
          type="button"
          (click)="onViewClick(row.id, row.name)"
          [attr.aria-label]="'View ' + row.name"
        >
          <sky-icon iconName="open" />
          View
        </button>
      </sky-dropdown-item>
      <sky-dropdown-item>
        <button type="button" (click)="onEditClick(row.id)" [attr.aria-label]="'Edit ' + row.name">
          <sky-icon iconName="edit" />
          Edit
        </button>
      </sky-dropdown-item>
      <sky-dropdown-item>
        <button
          type="button"
          (click)="onDeleteClick(row.id)"
          [attr.aria-label]="'Delete ' + row.name"
        >
          <sky-icon iconName="delete" />
          Delete
        </button>
      </sky-dropdown-item>
    </sky-dropdown-menu>
  </sky-dropdown>
</ng-template>

<ng-template #avatarTemplate let-row="row">
  <div class="image-column">
    <sky-avatar
      [name]="row.name"
      [src]="(row.images.length && row.images[0].url) || undefined"
      size="small"
    />
  </div>
</ng-template>

<ng-template #starTemplate let-value="value" let-row="row">
  <sky-button
    buttonStyle="link-inline"
    class="link-column"
    [class.needs-attention-not-starred]="!value"
    iconName="star"
    [labelHidden]="true"
    [labelText]="value ? 'Needs attention' : 'Click to mark as needing attention'"
    (buttonClick)="toggleNeedsAttention(row)"
  />
</ng-template>

<ng-template #linkTemplate let-value="value" let-row="row">
  <sky-button
    buttonStyle="link-inline"
    class="link-column"
    [labelText]="value"
    (buttonClick)="onViewClick(row.id, row.name)"
  />
</ng-template>

<sky-page layout="list">
  <sky-page-header pageTitle="Animal Profiles" [parentLink]="parentLink" />
  <sky-page-content>
    <sky-data-manager>
      <sky-data-manager-toolbar>
        <sky-data-manager-toolbar-primary-item>
          <sky-button
            data-sky-id="new-button"
            iconName="add"
            labelText="New"
            (buttonClick)="onEditClick()"
          />
        </sky-data-manager-toolbar-primary-item>
        <sky-data-manager-toolbar-right-item>
          <sky-button
            class="reset-data"
            data-sky-id="reset-data-button"
            iconName="delete"
            labelText="Reset data"
            (buttonClick)="onReset()"
          />
        </sky-data-manager-toolbar-right-item>
      </sky-data-manager-toolbar>
      <sky-data-view skyAgGridDataManagerAdapter viewId="gridView">
        <sky-ag-grid-wrapper
          skyAgGridRowDelete
          [(rowDeleteIds)]="rowDeleteIds"
          (rowDeleteConfirm)="rowDeleteConfirm($event)"
        >
          <ag-grid-angular [gridOptions]="gridOptions" [rowData]="rows()" />
        </sky-ag-grid-wrapper>
      </sky-data-view>
    </sky-data-manager>
  </sky-page-content>
</sky-page>
